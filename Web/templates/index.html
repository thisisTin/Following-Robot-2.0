<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robot Panel (Đã sửa lỗi)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    
    <style>
        /* (Style cơ bản giữ nguyên) */
        @keyframes subtleGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulseGreen { 0% { box-shadow: 0 0 3px #0f0; } 50% { box-shadow: 0 0 15px #0f0; } 100% { box-shadow: 0 0 3px #0f0; } }
        @keyframes pulseYellow { 0% { box-shadow: 0 0 3px #fa0; } 50% { box-shadow: 0 0 15px #fa0; } 100% { box-shadow: 0 0 3px #fa0; } }
        @keyframes pulseBlue { 0% { box-shadow: 0 0 3px #0af; } 50% { box-shadow: 0 0 15px #0af; } 100% { box-shadow: 0 0 3px #0af; } }
        
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0; display: flex;
            margin: 0; padding: 0;
            box-sizing: border-box;
            height: 100vh; width: 100vw;
            overflow: hidden;
            background: linear-gradient(-45deg, #1a1a2e, #121212, #1a1a2e);
            background-size: 400% 400%;
            animation: subtleGradient 20s ease infinite;
        }
        .container {
            display: flex; flex-direction: column;
            width: 100%; height: 100%; gap: 0;
        }
        .video-container {
            flex: 1; display: flex;
            justify-content: center; align-items: center;
            background: #000; min-height: 0;
            padding: 5px; box-sizing: border-box;
            position: relative; /* Thêm để vẽ canvas */
        }
        .controls {
            flex: 1; display: flex; flex-direction: column;
            min-height: 0; overflow-y: auto;
            padding: 1rem;
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Thẻ <img> chính để stream video */
        #video-feed {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* Thay đổi con trỏ khi ở IDLE */
            cursor: default;
        }
        #video-feed.idle-mode {
            cursor: pointer; /* Cho phép click khi ở IDLE */
        }
        
        /* Canvas VẼ BOX (nằm đè lên video) */
        #draw-canvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none; /* Cho phép click xuyên qua */
        }

        #status-display {
            padding: 10px; background: rgba(0, 0, 0, 0.2);
            margin-bottom: 10px; border-radius: 8px;
            border-left: 5px solid #555;
            transition: all 0.3s ease-in-out;
            display: flex; justify-content: space-between;
        }
        #status-state { font-size: 1.2em; font-weight: bold; }
        #status-fps { font-size: 1.2em; color: #aaa; }
        #status-display.following { animation: pulseGreen 1.5s infinite; border-left-color: #0f0; }
        #status-display.idle { animation: pulseYellow 2s infinite; border-left-color: #fa0; }
        #status-display.manual { animation: pulseBlue 1.5s infinite; border-left-color: #0af; }
        
        .mode-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mode-controls button {
            padding: 12px 5px; font-size: 0.9em;
            font-weight: 600; color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .mode-controls button:disabled {
            color: #555; background: rgba(0, 0, 0, 0.1);
            cursor: not-allowed;
        }
        .mode-controls button:active:not(:disabled) { transform: translateY(2px); }

        #btn-cancel { color: #ff3b3b; } /* Nút Hủy (Màu đỏ) */
        #btn-manual { color: #00aaff; }
        #btn-idle { color: #ffaa00; }
        #btn-light {
            color: #f0f0f0; background: rgba(80, 80, 80, 0.5);
        }
        #btn-light.on {
            color: #000; background: #ffff00;
            box-shadow: 0 0 15px #ffff00;
        }
        
        /* Style D-Pad (4 nút) */
        .joystick-area {
            display: flex; align-items: center;
            justify-content: center;
            padding-top: 10px;
            flex-grow: 1;
        }
        .d-pad-container { width: 180px; height: 180px; }
        .d-pad-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px; width: 100%; height: 100%;
        }
        .d-pad-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; font-size: 24px;
            cursor: pointer; border-radius: 10px;
            user-select: none; -webkit-user-select: none;
            transition: background 0.1s ease;
        }
        .d-pad-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(1px);
        }
        .d-pad-center {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Stream">
            <canvas id="draw-canvas"></canvas>
        </div>
        
        <div class="controls">
            <div id="status-display">
                <div id="status-state">STATE: ...</div>
                <div id="status-fps">FPS: --</div>
            </div>

            <div class="mode-controls">
                <button id="btn-idle">Chế độ Idle (Chờ)</button>
                <button id="btn-manual">Chế độ Manual</button>
                <button id="btn-cancel">Hủy Follow</button>
                <button id="btn-light">Bật Đèn</button>
            </div>

            <div class="joystick-area">
                <div class="d-pad-container">
                    <div class="d-pad-grid">
                        <div></div> 
                        <button id="d-pad-up" class="d-pad-btn">▲</button>
                        <div></div> 
                        <button id="d-pad-left" class="d-pad-btn">◄</button>
                        <div class="d-pad-center"></div> 
                        <button id="d-pad-right" class="d-pad-btn">►</button>
                        <div></div> 
                        <button id="d-pad-down" class="d-pad-btn">▼</button>
                        <div></div> 
                    </div>
                </div>
            </div>
            <p style="text-align: center; margin:0; font-size: 0.8em;">Lệnh: <b id="joystick-command">STOP</b></p>
        </div>
    </div>

    <script>
        // --- 1. KẾT NỐI SOCKET ---
        const socket = io();

        // --- 2. LẤY CÁC PHẦN TỬ ---
        const videoFeed = document.getElementById('video-feed');
        const drawCanvas = document.getElementById('draw-canvas');
        const ctx = drawCanvas.getContext('2d');

        const statusDisplay = document.getElementById('status-display');
        const statusState = document.getElementById('status-state');
        const statusFps = document.getElementById('status-fps');
        
        const btnManual = document.getElementById('btn-manual');
        const btnIdle = document.getElementById('btn-idle');
        const btnCancel = document.getElementById('btn-cancel');
        const btnLight = document.getElementById('btn-light');
        const joystickCommandDisplay = document.getElementById('joystick-command');

        let detectedBoxes = []; // Lưu box để vẽ và click
        let nativeVideoWidth = 640; // Giữ kích thước gốc
        let nativeVideoHeight = 480;

        // --- 3. ĐỒNG BỘ CANVAS VỚI VIDEO ---
        function resizeCanvas() {
            const videoRect = videoFeed.getBoundingClientRect();
            drawCanvas.width = videoRect.width;
            drawCanvas.height = videoRect.height;
            // Lưu lại kích thước gốc của video (quan trọng)
            nativeVideoWidth = videoFeed.naturalWidth || 640;
            nativeVideoHeight = videoFeed.naturalHeight || 480;
        }
        videoFeed.onload = resizeCanvas;
        window.onresize = resizeCanvas;
        // Chạy resize sau 1s (để chắc chắn video đã load)
        setTimeout(resizeCanvas, 1000);

        // --- 4. HÀM VẼ BOX (Render Loop) ---
        function renderBoxes() {
            // Xóa canvas
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            // Tính tỉ lệ scale
            const scaleX = drawCanvas.width / nativeVideoWidth;
            const scaleY = drawCanvas.height / nativeVideoHeight;

            for (const boxData of detectedBoxes) {
                const [x1, y1, x2, y2] = boxData.rect;
                
                // Scale tọa độ box
                const d_x = x1 * scaleX;
                const d_y = y1 * scaleY;
                const d_w = (x2 - x1) * scaleX;
                const d_h = (y2 - y1) * scaleY;

                ctx.strokeStyle = '#FFFF00'; // Vàng (Mặc định)
                ctx.fillStyle = '#FFFF00';
                ctx.lineWidth = 2;
                
                // (Code này có thể vẽ tên nếu backend gửi)
                // const label = boxData.name || `ID: ${boxData.id}`;
                const label = `ID: ${boxData.id}`;

                ctx.strokeRect(d_x, d_y, d_w, d_h);
                ctx.font = '16px Arial';
                ctx.fillText(label, d_x, d_y - 5);
            }
            // Yêu cầu vẽ lại frame tiếp theo
            requestAnimationFrame(renderBoxes);
        }
        // Bắt đầu vòng lặp vẽ
        renderBoxes();

        
        // --- 5. LOGIC CLICK-ĐỂ-FOLLOW (FIX LỖI "KHÔNG CHỌN ĐƯỢC") ---
        videoFeed.onclick = (event) => {
            // Chỉ cho phép click khi đang ở IDLE
            if (!statusDisplay.classList.contains('idle')) {
                console.log('Chỉ được chọn mục tiêu khi đang ở chế độ IDLE.');
                return;
            }

            // Lấy tọa độ click trên ảnh (đã scale)
            const rect = videoFeed.getBoundingClientRect();
            const scaleX = nativeVideoWidth / rect.width;
            const scaleY = nativeVideoHeight / rect.height;

            const clickX = (event.clientX - rect.left) * scaleX;
            const clickY = (event.clientY - rect.top) * scaleY;
            
            console.log(`Đã click tại (${clickX.toFixed(0)}, ${clickY.toFixed(0)}). Đang tìm box...`);

            // So sánh với danh sách box
            let targetFound = false;
            for (const boxData of detectedBoxes) {
                const [x1, y1, x2, y2] = boxData.rect;
                
                if (clickX > x1 && clickX < x2 && clickY > y1 && clickY < y2) {
                    const targetId = boxData.id;
                    console.log(`ĐÃ TRÚNG MỤC TIÊU! Gửi ID: ${targetId}`);
                    
                    // *** GỬI LỆNH LÊN SERVER (ĐÚNG TÊN) ***
                    socket.emit('set_target_id', {'id': targetId});
                    
                    targetFound = true;
                    break;
                }
            }
            if (!targetFound) {
                console.log('Click trượt, không trúng box nào.');
            }
        };


        // --- 6. NHẬN DỮ LIỆU TỪ SERVER ---
        socket.on('robot_info', (data) => {
            const state = data.state;
            statusState.textContent = `STATE: ${state}`;
            statusFps.textContent = `FPS: ${data.fps}`;  
            statusDisplay.className = state.toLowerCase(); 

            // Vô hiệu hóa nút của chế độ hiện tại
            btnIdle.disabled = (state === 'IDLE');
            btnManual.disabled = (state === 'MANUAL');
            
            // Cập nhật nút Hủy
            btnCancel.style.display = (state === 'FOLLOWING') ? 'block' : 'none';

            // Cập nhật con trỏ chuột
            videoFeed.className = (state === 'IDLE') ? 'idle-mode' : '';
            
            // Cập nhật nút Đèn
            if (data.light) {
                btnLight.textContent = 'Tắt Đèn';
                btnLight.className = 'on';
            } else {
                btnLight.textContent = 'Bật Đèn';
                btnLight.className = '';
            }
        });

        // Nhận danh sách box (chỉ khi ở IDLE)
        socket.on('detected_boxes', (data) => {
            // Lưu box để vẽ và click
            detectedBoxes = data.boxes || []; 
        });
        
        // --- 7. GỬI LỆNH (NÚT BẤM) (FIX LỖI "BẤM KHÔNG ĐƯỢC") ---
        
        btnManual.onclick = () => {
            console.log('Gửi lệnh: set_mode_manual');
            socket.emit('set_mode_manual');
        };
        
        btnIdle.onclick = () => {
            console.log('Gửi lệnh: set_mode_idle');
            socket.emit('set_mode_idle');
        };

        btnCancel.onclick = () => {
            console.log('Gửi lệnh: cancel_target');
            socket.emit('cancel_target'); // Backend sẽ tự chuyển về IDLE
        };

        btnLight.onclick = () => {
            console.log('Gửi lệnh: toggle_light');
            socket.emit('toggle_light');
        };


        // --- 8. GỬI LỆNH (D-PAD) ---
        var currentManualCommand = "STOP";

        function sendManualCommand(cmd) {
            // Chỉ gửi khi lệnh thay đổi
            if (cmd !== currentManualCommand) { // <--- DÒNG NÀY GÂY LỖI
                socket.emit('robot_command', { command: 'MANUAL_' + cmd });
                joystickCommandDisplay.textContent = cmd;
                currentManualCommand = cmd;
            }
        }

        const dPadButtons = {
            'd-pad-up': 'FORWARD',
            'd-pad-down': 'BACKWARD',
            'd-pad-left': 'LEFT',
            'd-pad-right': 'RIGHT'
        };

        // Gán sự kiện cho 4 nút
        for (const [id, command] of Object.entries(dPadButtons)) {
            const button = document.getElementById(id);
            
            const sendCmd = (e) => {
                e.preventDefault(); 
                sendManualCommand(command);
            };
            const sendStop = (e) => {
                e.preventDefault();
                sendManualCommand("STOP");
            };

            // Mouse events (PC)
            button.addEventListener('mousedown', sendCmd);
            button.addEventListener('mouseup', sendStop);
            button.addEventListener('mouseleave', sendStop); 

            // Touch events (Mobile)
            button.addEventListener('touchstart', sendCmd);
            button.addEventListener('touchend', sendStop);
        }
    </script>
</body>
</html>
