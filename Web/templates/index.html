<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ð Robot Operating Control Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        /* (CÃ¡c keyframes vÃ  style gá»c giá»¯ nguyÃªn) */
        @keyframes subtleGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulseGreen { 0% { box-shadow: 0 0 3px #0f0; } 50% { box-shadow: 0 0 15px #0f0; } 100% { box-shadow: 0 0 3px #0f0; } }
        @keyframes pulseYellow { 0% { box-shadow: 0 0 3px #fa0; } 50% { box-shadow: 0 0 15px #fa0; } 100% { box-shadow: 0 0 3px #fa0; } }
        @keyframes pulseBlue { 0% { box-shadow: 0 0 3px #0af; } 50% { box-shadow: 0 0 15px #0af; } 100% { box-shadow: 0 0 3px #0af; } }
        
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0; display: flex;
            margin: 0; padding: 0;
            box-sizing: border-box;
            height: 100vh; width: 100vw;
            overflow: hidden;
            background: linear-gradient(-45deg, #1a1a2e, #121212, #1a1a2e);
            background-size: 400% 400%;
            animation: subtleGradient 20s ease infinite;
        }
        h1, h2 {
            font-weight: 500; color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px; margin-top: 0;
        }
        .container {
            display: flex; flex-direction: column;
            width: 100%; height: 100%; gap: 0;
        }
        .video-container {
            flex: 1; display: flex;
            justify-content: center; align-items: center;
            background: #000; min-height: 0;
            padding: 5px; box-sizing: border-box;
        }
        .controls {
            flex: 1; display: flex; flex-direction: column;
            min-height: 0; overflow-y: auto;
            padding: 1rem;
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        /* --- THAY Äá»I Lá»N --- */
        /* Bá» img, thay báº±ng canvas */
        #video-canvas {
            cursor: pointer;
        }
        /* --- Káº¾T THÃC THAY Äá»I --- */

        #status-display {
            padding: 10px; background: rgba(0, 0, 0, 0.2);
            margin-bottom: 10px; border-radius: 8px;
            border-left: 5px solid #555;
            transition: all 0.3s ease-in-out;
            display: flex; justify-content: space-between;
        }
        #status-state { font-size: 1.2em; font-weight: bold; }
        #status-fps { font-size: 1.2em; color: #aaa; }
        #status-display.following { animation: pulseGreen 1.5s infinite ease-in-out; border-left-color: #0f0; }
        #status-display.idle { animation: pulseYellow 2s infinite ease-in-out; border-left-color: #fa0; }
        #status-display.manual { animation: pulseBlue 1.5s infinite ease-in-out; border-left-color: #0af; }
        .mode-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mode-controls button {
            padding: 12px 5px; font-size: 0.9em;
            font-weight: 600; color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .mode-controls button:disabled {
            color: #555;
            background: rgba(0, 0, 0, 0.1);
            cursor: not-allowed;
        }
        .mode-controls button:active:not(:disabled) { transform: translateY(2px); }

        #btn-follow { color: #00ff00; }
        #btn-follow.stop { color: #ff3b3b; }
        #btn-manual { color: #00aaff; }
        #btn-idle { color: #ffaa00; }
        #btn-light {
            color: #f0f0f0;
            background: rgba(80, 80, 80, 0.5);
        }
        #btn-light.on {
            color: #000;
            background: #ffff00;
            box-shadow: 0 0 15px #ffff00;
        }
        .joystick-area {
            display: flex; align-items: center;
            justify-content: center;
            padding-top: 10px;
            flex-grow: 1;
        }
        #joystick-container {
            position: relative;
            width: 150px; height: 150px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nipple .front {
            background: linear-gradient(145deg, #00aaff, #0077cc) !important;
        }
        .nipple.active .front {
            transform: scale(1.1);
            box-shadow: 0 0 20px #00aaff, 0 0 35px #00ffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <!-- THAY THáº¾: Bá» <img>, dÃ¹ng <canvas> -->
            <canvas id="video-canvas"></canvas>
        </div>
        
        <div class="controls">
            <div id="status-display">
                <div id="status-state">STATE: ...</div>
                <div id="status-fps">FPS: --</div>
            </div>

            <div class="mode-controls">
                <!-- NÃºt Follow sáº½ ÄÆ°á»£c quáº£n lÃ½ báº±ng JS -->
                <button id="btn-follow">Follow</button> 
                <!-- <button id="btn-manual">Manual</button> --> <!-- <<< THAY Äá»I: ÄÃ£ xÃ³a -->
                <!-- <button id="btn-idle">Idle</button> --> <!-- <<< THAY Äá»I: ÄÃ£ xÃ³a -->
                <button id="btn-light">Báº­t ÄÃ¨n</button>
            </div>

            <div class="joystick-area">
                <div id="joystick-container"></div>
            </div>
            <p style="text-align: center; margin:0; font-size: 0.8em;">Lá»nh: <b id="joystick-command">STOP</b></p>
        </div>
    </div>

    <script>
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        
        // --- Láº¥y cÃ¡c pháº§n tá»­ ---
        var statusDisplay = document.getElementById('status-display');
        var statusState = document.getElementById('status-state');
        var statusFps = document.getElementById('status-fps');
        var followBtn = document.getElementById('btn-follow');
        var lightBtn = document.getElementById('btn-light');
        var joystickCommandDisplay = document.getElementById('joystick-command');

        // --- CÃ€I Äáº¶T CANVAS Má»I ---
        var canvas = document.getElementById('video-canvas');
        var ctx = canvas.getContext('2d', { alpha: false });

        // Táº¡o má»t Äá»i tÆ°á»£ng Image Äá» nháº­n stream
        var videoStream = new Image();
        videoStream.src = "{{ url_for('video_feed') }}";

        // Biáº¿n lÆ°u trá»¯ kÃ­ch thÆ°á»c video gá»c (tá»« Python)
        var nativeVideoWidth = window ? window.innerWidth : 640; 
        var nativeVideoHeight = window ? window.innerHeight / 2 : 480;

        // Äáº·t kÃ­ch thÆ°á»c buffer cá»§a canvas
        canvas.width = 16 * nativeVideoHeight / 9;
        canvas.height = nativeVideoHeight;
        
        // Biáº¿n lÆ°u trá»¯ danh sÃ¡ch box
        var currentBoxes = [];
        var currentTargetId = null;

        // --- VÃ²ng láº·p Váº¼ (Render Loop) ---
        function renderLoop() {
            // 1. Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Váº½ video stream
            ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);

            // 3. Váº½ cÃ¡c bounding box
            for (var box of currentBoxes) {
                var rect = box.rect; // [x1, y1, x2, y2]
                var id = box.id;
                
                // Chá»n mÃ u: Xanh lÃ¡ cho má»¥c tiÃªu, VÃ ng cho ngÆ°á»i khÃ¡c
                if (id === currentTargetId) {
                    ctx.strokeStyle = '#00FF00'; // Green (Target)
                    ctx.fillStyle = '#00FF00';
                    ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = '#FFFF00'; // Yellow (Other)
                    ctx.fillStyle = '#FFFF00';
                    ctx.lineWidth = 2;
                }
                
                // Váº½ box
                ctx.strokeRect(rect[0], rect[1], rect[2] - rect[0], rect[3] - rect[1]);
                
                // Váº½ ID
                ctx.font = '16px Arial';
                ctx.fillText('ID: ' + id, rect[0], rect[1] - 5);
            }
            
            // YÃªu cáº§u váº½ khung hÃ¬nh tiáº¿p theo
            requestAnimationFrame(renderLoop);
        }

        // Báº¯t Äáº§u vÃ²ng láº·p khi video load
        videoStream.onload = () => {
            requestAnimationFrame(renderLoop);
        };


        // --- Xá»¬ LÃ CLICK Má»I TRÃN CANVAS ---
        canvas.addEventListener('click', function(evt) {
            // Láº¥y vá» trÃ­ cá»§a canvas trÃªn trang
            var rect = canvas.getBoundingClientRect();
            
            // TÃ­nh toÃ¡n tá»· lá» co giÃ£n cá»§a canvas (do CSS)
            // (ChÃºng ta giáº£ Äá»nh canvas ÄÆ°á»£c co giÃ£n Äá» vá»«a vá»i container)
            var scaleX = canvas.width / rect.width;
            var scaleY = canvas.height / rect.height;

            // TÃ­nh tá»a Äá» click bÃªn trong buffer cá»§a canvas (640x480)
            var canvasX = (evt.clientX - rect.left) * scaleX;
            var canvasY = (evt.clientY - rect.top) * scaleY;

            var foundTarget = null;
            // Kiá»m tra xem cÃº click cÃ³ trÃºng box nÃ o khÃ´ng
            for (var box of currentBoxes) {
                var r = box.rect; // [x1, y1, x2, y2]
                if (canvasX >= r[0] && canvasX <= r[2] && canvasY >= r[1] && canvasY <= r[3]) {
                    foundTarget = box;
                    break;
                }
            }
            
            if (foundTarget) {
                // ÄÃ£ click trÃºng! Gá»­i ID vá» server
                console.log('Clicked target ID:', foundTarget.id);
                socket.emit('set_target_id', { id: foundTarget.id });
            } else {
                console.log('Clicked on video, but no target.');
            }
        });


        // --- Event Listener: Nháº­n thÃ´ng tin tá»« server (Cáº¬P NHáº¬T) ---
        socket.on('robot_info', function(data) {
            statusState.textContent = 'STATE: ' + data.state;
            statusFps.textContent = 'FPS: ' + data.fps;  
            statusDisplay.className = data.state.toLowerCase(); 
            
            currentTargetId = null; // Reset

            if (data.state === 'FOLLOWING') {
                followBtn.textContent = 'Há»§y Theo DÃµi';
                followBtn.className = 'stop'; // MÃ u Äá»
                followBtn.disabled = false;
                
            } else { // <<< THAY Äá»I: Bao gá»m cáº£ MANUAL (tráº¡ng thÃ¡i máº·c Äá»nh má»i)
                followBtn.textContent = 'Click Person to Follow';
                if (data.state === 'MANUAL') {
                    followBtn.textContent = 'Cháº¿ Äá» Manual';
                }
                followBtn.className = '';
                followBtn.disabled = true; // VÃ´ hiá»u hÃ³a
            }

            // Cáº­p nháº­t nÃºt ÄÃ¨n (giá»¯ nguyÃªn)
            if (data.light) {
                lightBtn.textContent = 'Táº¯t ÄÃ¨n';
                lightBtn.className = 'on';
            } else {
                lightBtn.textContent = 'Báº­t ÄÃ¨n';
                lightBtn.className = '';
            }
        });

        // --- Event Listener Má»I: Nháº­n danh sÃ¡ch box ---
        socket.on('detected_boxes', function(data) {
            currentBoxes = data.boxes;
            
            // TÃ¬m xem target_id cÃ³ cÃ²n trong danh sÃ¡ch khÃ´ng
            var targetVisible = false;
            if (currentTargetId !== null) {
                for(var box of currentBoxes) {
                    if (box.id === currentTargetId) {
                        targetVisible = true;
                        break;
                    }
                }
            }
            // (Náº¿u khÃ´ng tháº¥y target, cÃ³ thá» cáº­p nháº­t HUD)
        });

        // --- Event Listener Má»I: Nháº­n ID má»¥c tiÃªu ÄÃ£ xÃ¡c nháº­n ---
        // (ChÃºng ta cáº§n server xÃ¡c nháº­n ID Äá» lÆ°u láº¡i)
        socket.on('target_acquired', function(data) {
            currentTargetId = data.id;
        });
        // Sá»­a: Dá»±a vÃ o logic trong robot_info lÃ  Äá»§

        // --- Event Listeners: Gá»­i lá»nh (Cáº¬P NHáº¬T) ---
        followBtn.onclick = () => {
            // NÃºt nÃ y giá» CHá» dÃ¹ng Äá» Há»¦Y
            if (statusDisplay.className === 'following') {
                socket.emit('cancel_target');
            }
        };
        // document.getElementById('btn-manual').onclick = () => socket.emit('robot_command', { command: 'SET_MANUAL' }); // <<< THAY Äá»I: ÄÃ£ xÃ³a
        // document.getElementById('btn-idle').onclick = () => socket.emit('robot_command', { command: 'SET_IDLE' }); // <<< THAY Äá»I: ÄÃ£ xÃ³a
        lightBtn.onclick = () => socket.emit('toggle_light');

        // --- Joystick Initialization (Giá»¯ nguyÃªn) ---
        var joystickContainer = document.getElementById('joystick-container');
        var currentManualCommand = "STOP";
        var joystick = nipplejs.create({
            zone: joystickContainer,
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'white',
            size: 140,
            threshold: 0.2
        });

        function sendManualCommand(cmd) {
            if (cmd !== currentManualCommand) {
                socket.emit('robot_command', { command: 'MANUAL_' + cmd });
                joystickCommandDisplay.textContent = cmd;
                currentManualCommand = cmd;
            }
        }

        // Joystick 8-Way move logic (Giá»¯ nguyÃªn)
        joystick.on('move', function (evt, data) {
            var angle = data.angle.degree;
            var commandToSend = "STOP"; 

            if (angle > 67.5 && angle < 112.5) { commandToSend = "FORWARD"; }
            else if (angle > 247.5 && angle < 292.5){ commandToSend = "BACKWARD"; }
            else if (angle > 22.5 && angle < 67.5) { commandToSend = "FORWARD_RIGHT"; } 
            else if (angle > 112.5 && angle < 157.5) { commandToSend = "FORWARD_LEFT"; } 
            else if (angle > 202.5 && angle <247.5) { commandToSend = "BACKWARD_LEFT"; }
            else if (angle > 292.5 && angle <337.5){ commandToSend = "BACKWARD_RIGHT"; }
            else if (angle > 157.5 && angle < 202.5) { commandToSend = "LEFT"; } 
            else if (angle > 337.5 || angle < 22.5) { commandToSend = "RIGHT"; } 
            
            sendManualCommand(commandToSend);
        });

        joystick.on('end', () => sendManualCommand("STOP"));
        
    </script>
</body>
</html>
