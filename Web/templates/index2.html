<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robot Control Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- GIAO DIỆN DARK MODE (CỦA BẠN) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* Chống bôi đen khi giữ nút */
            -webkit-user-select: none;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: row; 
        }

        /* KHUNG VIDEO */
        .video-box {
            flex: 2;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #video-feed {
            max-width: 100%;
            max-height: 100%;
            border: 2px solid #333;
            cursor: crosshair; /* Con trỏ nhắm bắn */
            display: block; /* Đảm bảo kích thước tính đúng */
        }
        
        /* Canvas vẽ Box */
        #draw-canvas {
            position: absolute;
            pointer-events: none; /* Cho phép click xuyên qua canvas xuống video */
        }

        /* KHUNG ĐIỀU KHIỂN */
        .controls-box {
            flex: 1;
            background: #1e1e1e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            border-left: 1px solid #333;
        }

        /* TRẠNG THÁI */
        .status-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #6c757d; /* Mặc định xám */
            transition: 0.3s;
        }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .highlight { font-weight: bold; color: #00ff00; }
        .val-num { font-family: monospace; font-weight: bold; font-size: 1.1em; }
        
        /* SLIDER */
        .slider-group {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
        }
        .slider-label { font-size: 0.9em; display: flex; justify-content: space-between; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; }

        /* NÚT BẤM */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            font-size: 1rem;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-manual { background: #007bff; }
        .btn-idle { background: #6c757d; }
        .btn-cancel { background: #dc3545; grid-column: span 2; display: none; } /* Ẩn mặc định */
        .btn-light { background: #ffc107; color: black; grid-column: span 2; }

        /* JOYSTICK D-PAD */
        .d-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 5px;
            align-self: center;
            margin-top: 10px;
        }
        .d-btn {
            background: #333;
            color: white;
            font-size: 30px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            border: 1px solid #444;
            transition: background 0.1s;
        }
        .d-btn:active { background: #007bff; border-color: #0056b3; }

        /* TELEMETRY CHART */
        .chart-box {
            background: #252525;
            padding: 5px;
            border-radius: 8px;
            height: 150px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .video-box { flex: 1; }
            .controls-box { flex: 1; border-top: 1px solid #333; }
            .d-pad { grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- KHUNG VIDEO -->
    <div class="video-box">
        <img id="video-feed" src="{{ url_for('video_feed') }}">
        <canvas id="draw-canvas"></canvas>
    </div>

    <!-- KHUNG ĐIỀU KHIỂN -->
    <div class="controls-box">
        
        <!-- BẢNG TRẠNG THÁI -->
        <div class="status-panel" id="status-panel">
            <div class="status-row">
                <span>Trạng thái:</span>
                <span id="lbl-state" class="highlight">CONNECTING...</span>
            </div>
            <div class="status-row">
                <span>Mục tiêu:</span>
                <span id="lbl-target">--</span>
            </div>
            <div class="status-row">
                <span>Failsafe (Front):</span>
                <span id="lbl-dist" style="color: yellow;">-- cm</span>
            </div>
        </div>

        <!-- BẢNG THÔNG SỐ PID (MỚI) -->
        <div class="status-panel" style="border-left-color: #d63384;">
            <div class="status-row">
                <span>Diện tích (Area):</span>
                <span id="lbl-area" class="val-num" style="color: cyan;">0</span>
            </div>
            <div class="status-row">
                <span>Sai số e(t):</span>
                <span id="lbl-error" class="val-num" style="color: orange;">0</span>
            </div>
            <div class="status-row">
                <span>PWM (L / R):</span>
                <span>
                    <span id="lbl-pwm-l" class="val-num" style="color: #ff6384;">0</span> / 
                    <span id="lbl-pwm-r" class="val-num" style="color: #36a2eb;">0</span>
                </span>
            </div>
        </div>

        <!-- BIỂU ĐỒ (TELEMETRY) -->
        <div class="chart-box">
            <canvas id="telemetryChart"></canvas>
        </div>

        <!-- SLIDER TỐC ĐỘ -->
        <div class="slider-group">
            <div class="slider-label">
                <span>⚡ Max Speed (PWM)</span>
                <span id="lbl-speed" style="color: yellow">185</span>
            </div>
            <input type="range" id="slider-speed" min="100" max="255" value="185">
        </div>

        <!-- NÚT CHỨC NĂNG -->
        <div class="btn-grid">
            <button class="btn-idle" onclick="setMode('IDLE')">⏸ DỪNG (IDLE)</button>
            <button class="btn-manual" onclick="setMode('MANUAL')">🎮 LÁI TAY</button>
            <button class="btn-cancel" id="btn-cancel" onclick="cancelFollow()">❌ HỦY FOLLOW</button>
        </div>

        <!-- D-PAD ĐIỀU KHIỂN -->
        <div class="d-pad">
            <div></div>
            <div id="btn-up" class="d-btn">▲</div>
            <div></div>
            
            <div id="btn-left" class="d-btn">◄</div>
            <div class="d-btn" style="border-radius: 50%; background:#222; cursor: default;"></div>
            <div id="btn-right" class="d-btn">►</div>
            
            <div></div>
            <div id="btn-down" class="d-btn">▼</div>
            <div></div>
        </div>
        
        <div style="text-align: center; color: #666; font-size: 0.8em; margin-top: 10px;">
            Lệnh đang gửi: <span id="last-cmd" style="color: white">STOP</span>
        </div>
    </div>
</div>

<script>
    // --- 1. KẾT NỐI SOCKET ---
    const socket = io();
    
    // DOM Elements
    const videoFeed = document.getElementById('video-feed');
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    
    const lblState = document.getElementById('lbl-state');
    const lblTarget = document.getElementById('lbl-target');
    const lblDist = document.getElementById('lbl-dist');
    const lblSpeed = document.getElementById('lbl-speed');
    const sliderSpeed = document.getElementById('slider-speed');
    const statusPanel = document.getElementById('status-panel');
    const btnCancel = document.getElementById('btn-cancel');
    const lastCmd = document.getElementById('last-cmd');

    // New Telemetry Labels
    const lblArea = document.getElementById('lbl-area');
    const lblError = document.getElementById('lbl-error');
    const lblPwmL = document.getElementById('lbl-pwm-l');
    const lblPwmR = document.getElementById('lbl-pwm-r');

    let detectedBoxes = [];
    let videoWidth = 640;
    let videoHeight = 480;

    // --- 2. BIỂU ĐỒ CHART.JS ---
    const ctxChart = document.getElementById('telemetryChart').getContext('2d');
    const telemetryChart = new Chart(ctxChart, {
        type: 'line',
        data: {
            labels: Array(30).fill(''), // Tăng lên 30 điểm
            datasets: [
                {
                    label: 'Error (e)',
                    data: Array(30).fill(0),
                    borderColor: '#ff6384', // Đỏ
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: 0
                },
                {
                    label: 'PWM Output',
                    data: Array(30).fill(0),
                    borderColor: '#36a2eb', // Xanh
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: 0
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#ccc', font: { size: 10 } } }
            },
            scales: {
                y: { display: true, min: -255, max: 255, grid: { color: '#444' } }, // Hiện trục Y để thấy biên độ
                x: { display: false }
            },
            animation: false
        }
    });

    // --- 3. XỬ LÝ SLIDER TỐC ĐỘ ---
    sliderSpeed.oninput = function() {
        lblSpeed.innerText = this.value;
    }
    sliderSpeed.onchange = function() {
        console.log("Cập nhật tốc độ:", this.value);
        socket.emit('update_manual_speed', { speed: this.value });
    }

    // --- 4. NHẬN DỮ LIỆU TỪ SERVER ---
    socket.on('robot_info', (data) => {
        lblState.innerText = data.state;
        lblTarget.innerText = (data.target_id !== null) ? `ID: ${data.target_id}` : "--";

        // Đổi màu trạng thái & Hiển thị nút Hủy
        if (data.state === 'FOLLOWING') {
            statusPanel.style.borderLeftColor = '#00ff00'; // Xanh lá
            lblState.style.color = '#00ff00';
            btnCancel.style.display = 'block'; // Hiện nút Hủy
        } 
        else if (data.state === 'MANUAL') {
            statusPanel.style.borderLeftColor = '#007bff'; // Xanh dương
            lblState.style.color = '#007bff';
            btnCancel.style.display = 'none';
        } 
        else {
            statusPanel.style.borderLeftColor = '#ffc107'; // Vàng (Idle)
            lblState.style.color = '#ffc107';
            btnCancel.style.display = 'none';
        }
    });

    socket.on('detected_boxes', (data) => {
        detectedBoxes = data.boxes || [];
    });

    // Nhận dữ liệu Telemetry CHI TIẾT
    socket.on('telemetry', (data) => {
        if(lblDist) lblDist.innerText = data.dist_front + " cm";
        if(lblArea) lblArea.innerText = data.area_input;
        if(lblError) lblError.innerText = data.error.toFixed(0);
        if(lblPwmL) lblPwmL.innerText = data.pwm_l;
        if(lblPwmR) lblPwmR.innerText = data.pwm_r;
        
        // Update Chart
        telemetryChart.data.datasets[0].data.push(data.error / 100); // Scale error xuống cho dễ nhìn chung với PWM
        telemetryChart.data.datasets[0].data.shift(); 
        
        telemetryChart.data.datasets[1].data.push(data.pwm_fwd);
        telemetryChart.data.datasets[1].data.shift(); 
        
        telemetryChart.update();
    });

    // --- 5. VẼ CANVAS & CLICK ĐỂ FOLLOW ---
    function resizeCanvas() {
        const rect = videoFeed.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        
        // Căn chỉnh vị trí canvas trùng khít video
        canvas.style.left = videoFeed.offsetLeft + "px";
        canvas.style.top = videoFeed.offsetTop + "px";

        videoWidth = videoFeed.naturalWidth || 640;
        videoHeight = videoFeed.naturalHeight || 480;
    }
    window.addEventListener('resize', resizeCanvas);
    videoFeed.onload = resizeCanvas;
    setInterval(resizeCanvas, 1000); 

    function drawLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const scaleX = canvas.width / videoWidth;
        const scaleY = canvas.height / videoHeight;

        detectedBoxes.forEach(box => {
            const [x1, y1, x2, y2] = box.rect;
            const sx = x1 * scaleX;
            const sy = y1 * scaleY;
            const sw = (x2 - x1) * scaleX;
            const sh = (y2 - y1) * scaleY;

            ctx.strokeStyle = "#00FF00";
            ctx.lineWidth = 2;
            ctx.strokeRect(sx, sy, sw, sh);
            
            ctx.fillStyle = "#00FF00";
            ctx.font = "bold 14px Arial";
            ctx.fillText(`ID: ${box.id}`, sx, sy - 5);
        });
        requestAnimationFrame(drawLoop);
    }
    drawLoop();

    // Click vào video để chọn mục tiêu
    videoFeed.onclick = (e) => {
        if (lblState.innerText === 'MANUAL') return;

        const rect = videoFeed.getBoundingClientRect();
        const scaleX = videoWidth / rect.width;
        const scaleY = videoHeight / rect.height;
        
        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        console.log(`Click tại: ${clickX.toFixed(0)}, ${clickY.toFixed(0)}`);

        let found = false;
        for (let box of detectedBoxes) {
            const [x1, y1, x2, y2] = box.rect;
            if (clickX >= x1 && clickX <= x2 && clickY >= y1 && clickY <= y2) {
                console.log(`--> Chọn ID: ${box.id}`);
                socket.emit('set_target_id', { id: box.id });
                found = true;
                break;
            }
        }
        if (!found) console.log("Không trúng box nào.");
    };

    // --- 6. NÚT ĐIỀU KHIỂN ---
    window.setMode = function(mode) {
        if (mode === 'IDLE') socket.emit('set_mode_idle');
        if (mode === 'MANUAL') socket.emit('set_mode_manual');
    }
    window.cancelFollow = function() { socket.emit('cancel_target'); }

    // --- 7. XỬ LÝ D-PAD ---
    const buttons = {
        'btn-up': 'FORWARD',
        'btn-down': 'BACKWARD',
        'btn-left': 'LEFT',
        'btn-right': 'RIGHT'
    };

    for (const [id, cmd] of Object.entries(buttons)) {
        const btn = document.getElementById(id);
        
        const startMove = (e) => {
            e.preventDefault(); 
            socket.emit('robot_command', { command: 'MANUAL_' + cmd });
            lastCmd.innerText = cmd;
            btn.style.background = '#0056b3';
        };
        
        const stopMove = (e) => {
            e.preventDefault();
            socket.emit('robot_command', { command: 'MANUAL_STOP' });
            lastCmd.innerText = "STOP";
            btn.style.background = '#333';
        };

        btn.addEventListener('mousedown', startMove);
        btn.addEventListener('mouseup', stopMove);
        btn.addEventListener('mouseleave', stopMove);
        btn.addEventListener('touchstart', startMove);
        btn.addEventListener('touchend', stopMove);
    }

</script>
</body>
</html>
