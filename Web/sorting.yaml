# Tệp: sorting.yaml
# Cấu hình BoTSORT đầy đủ, đã bao gồm tùy chỉnh của bạn

tracker_type: botsort  # Loại tracker

# --- Các tham số chính của tracker (đã tùy chỉnh) ---
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.8     # <<< CẢNH BÁO: 1.0 là quá cao, đã sửa thành 0.8
track_buffer: 150         # <<< THAY ĐỔI: Tăng bộ nhớ lên 150
match_thresh: 0.7         # <<< THAY ĐỔI: Ngưỡng khớp IoU
        
# --- Các tham số bắt buộc (đã bị thiếu) ---
gmc_method: sparseOptFlow # <<< ĐÂY LÀ DÒNG GÂY LỖI
        
# --- Các tham số Re-ID (đã tùy chỉnh) ---
proximity_thresh: 0.6     # <<< THAY ĐỔI: Ngưỡng "gần"
appearance_thresh: 0.7    # <<< THAY ĐỔI: Ngưỡng "giống nhau"
with_reid: true           # <<< SỬA LỖI: Phải là true/false, không phải 'track_buffer'
        
# --- Các tham số Re-ID (mặc định) ---
model: osnet_x0_25        # Model Re-ID
weights: null             # (Tự động tải về)
device: cpu               # Chạy Re-ID trên CPU
fp16: false               # Không dùng FP16